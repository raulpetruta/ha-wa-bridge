configuration:
  api_token:
    name: API Token
    description: >-
      Required. Shared secret that every WebSocket client must send before it can
      control the bridge. Use at least 16 characters; generate a long random value
      with "openssl rand -hex 32" and enter the same value in the integration's
      API token field. There is no default, so the add-on cannot start until this
      is set. The bridge refuses to start without it. Never expose the bridge
      port to the internet.
  detect_own_messages:
    name: Detect Own Messages (works in groups only)
    description: >-
      When enabled, messages sent from your own WhatsApp account (e.g. via WhatsApp Web
      or your phone) are forwarded to Home Assistant.
      Note: this only works inside group chats, not in 1-to-1 conversations.
  incoming_messages_mode:
    name: Incoming Messages Mode
    description: >-
      Controls which incoming messages are forwarded to Home Assistant.
      'all' = everything (default); 'disabled' = nothing, send-only mode;
      'groups_only' = group messages only; 'numbers_only' = direct messages from
      numbers listed in Allowed Numbers only.
  incoming_message_log_level:
    name: Incoming Message Log Level
    description: >-
      Controls the amount of detail logged when receiving messages or poll votes.
      'FULL' = log entire message payload (default); 'COMPACT' = log only sender
      and message type; 'NONE' = disable logging for incoming messages.
  allowed_groups:
    name: Allowed Groups
    description: >-
      Optional. When set, only messages from group chats whose name matches one of
      these entries (case-insensitive) will be forwarded. Leave empty to apply no
      group filter. Ignored in 'numbers_only' mode.
  allowed_numbers:
    name: Allowed Numbers
    description: >-
      Optional. Phone numbers in international format without '+' (e.g. 40741234567).
      Required for 'numbers_only' mode, where only direct messages from these
      numbers are forwarded. In 'all' mode it also filters messages by sender.
      It is ignored in 'groups_only' mode. Leave empty to apply no number filter.
  media_download_path:
    name: Media Download Path
    description: >-
      Optional directory where received photos, videos, and files are saved.
      Leave empty to skip downloads. Use a location that Home Assistant does not
      serve, for example /media/whatsapp. The add-on has read-write access to
      /media. Do NOT point this at /config/www (or anything below it): everything
      under /config/www is served unauthenticated at /local/, so received private
      media would be readable by anyone who can reach your instance. If you saved
      media there with an older version, move or delete those files. The saved
      path is included on the message event as mediaPath. The same
      incoming-message filters apply.
